  /*
    Ghana editorial. Warm paper, near-black traced silhouettes, Ghana gold as
    the only accent. The dark theme is an evening reading of the same palette —
    the paper becomes the ink and the gold holds on both grounds — rather than
    an inversion.
  */
  :root {
    --paper: #f7f5f0;
    --paper-deep: #efece4;
    --card: #fdfcfa;
    --ink: #14100e;
    --ink-soft: #4a423c;
    --ink-faint: #8c827a;
    --line: rgb(20 16 14 / 0.12);
    --gold: #a6851f;
    --forest: #046a38;
    --grain: rgb(20 16 14 / 0.022);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {

      --paper: #14100e;
      --paper-deep: #1b1613;
      --card: #1c1714;
      --ink: #f2ede3;
      --ink-soft: #c3b8a9;
      --ink-faint: #8a7f71;
      --line: rgb(242 237 227 / 0.14);
      --gold: #d8b451;
      --forest: #4aa87a;
      --grain: rgb(242 237 227 / 0.02);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --paper: #14100e;
    --paper-deep: #1b1613;
    --card: #1c1714;
    --ink: #f2ede3;
    --ink-soft: #c3b8a9;
    --ink-faint: #8a7f71;
    --line: rgb(242 237 227 / 0.14);
    --gold: #d8b451;
    --forest: #4aa87a;
    --grain: rgb(242 237 227 / 0.02);
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --paper: #f7f5f0;
    --paper-deep: #efece4;
    --card: #fdfcfa;
    --ink: #14100e;
    --ink-soft: #4a423c;
    --ink-faint: #8c827a;
    --line: rgb(20 16 14 / 0.12);
    --gold: #a6851f;
    --forest: #046a38;
    --grain: rgb(20 16 14 / 0.022);
    color-scheme: light;
  }

  @property --focus {
    syntax: "<number>";
    inherits: true;
    initial-value: 0;
  }

  @property --dim {
    syntax: "<number>";
    inherits: false;
    initial-value: 1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, var(--grain) 1px, transparent 0);
    background-size: 4px 4px;
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--gold); color: var(--paper); }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }

  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  /* ---------- skyline ---------- */

  .stage { display: flex; flex-direction: column; height: 100dvh; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1.25rem 1.25rem 0;
    flex-shrink: 0;
  }
  @media (min-width: 640px) { .topbar { padding: 1.75rem 2rem 0; } }
  .topbar .meta { color: var(--ink-faint); }
  @media (max-width: 639px) { .topbar .meta { display: none; } }

  .intro { flex-shrink: 0; padding: 1.25rem 1.25rem 0.75rem; text-align: center; }
  @media (min-width: 640px) { .intro { padding: 1.75rem 1.25rem 1rem; } }

  .intro h1 {
    margin: 0 auto;
    max-width: 22ch;
    font-size: clamp(2rem, 5.5vw, 3.5rem);
    line-height: 1.05;
    text-wrap: balance;
  }

  .intro p {
    margin: 0.75rem auto 0;
    max-width: 42ch;
    font-size: 0.875rem;
    line-height: 1.6;
    color: var(--ink-soft);
    text-wrap: balance;
  }

  .search { position: relative; margin: 1.25rem auto 0; width: min(100%, 24rem); }

  .search input {
    width: 100%;
    height: 2.75rem;
    padding: 0 2.5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: color-mix(in oklab, var(--card) 70%, transparent);
    color: var(--ink);
    font: inherit;
    font-size: 0.875rem;
    text-align: center;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:focus-visible { border-color: var(--gold); outline-offset: 2px; }

  .search button {
    position: absolute;
    right: 0.9rem;
    top: 50%;
    translate: 0 -50%;
    border: 0;
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0.25rem;
    line-height: 1;
  }
  .search button:hover { color: var(--ink); }
  .search button[hidden] { display: none; }

  .skyline { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }

  .track {
    position: relative;
    display: flex;
    align-items: flex-end;
    height: 100%;
    margin: 0;
    padding: 0 50%;
    list-style: none;
    gap: clamp(3rem, 7vw, 8rem);
    will-change: transform;
    /* Sinks the row into the ground gradient. */
    top: clamp(6px, 1.6vh, 16px);
  }

  .monument {
    --focus: 0;
    --dim: 1;
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    color: color-mix(in oklab, var(--ink) calc(var(--focus) * 100%), var(--ink-faint));
    opacity: calc((0.22 + 0.78 * var(--focus)) * var(--dim));
    transition: --dim 700ms var(--ease);
  }

  .monument .year {
    position: absolute;
    bottom: 18%;
    left: 50%;
    translate: -50% 0;
    font-size: clamp(5rem, 14vw, 13rem);
    line-height: 1;
    color: var(--ink);
    opacity: calc(var(--focus) * 0.06);
    pointer-events: none;
  }

  .monument .pin {
    position: absolute;
    bottom: calc(100% + 0.75rem);
    left: 50%;
    translate: -50% 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.4rem 0.75rem;
    border: 1px solid color-mix(in oklab, var(--gold) 50%, transparent);
    border-radius: 999px;
    background: color-mix(in oklab, var(--paper) 85%, transparent);
    color: var(--ink);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 300ms var(--ease), translate 300ms var(--ease);
    pointer-events: none;
  }
  .monument[data-active] .pin { opacity: 1; }
  .monument .pin::before {
    content: "";
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 999px;
    background: var(--gold);
  }

  .monument button {
    position: relative;
    display: block;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    top: calc((1 - var(--focus)) * 0.5rem);
    transition: top 500ms var(--ease);
  }
  .monument button:hover { top: calc((1 - var(--focus)) * 0.5rem - 0.375rem); }

  .monument svg { display: block; width: 100%; height: 100%; }

  .ground {
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    height: 15%;
    pointer-events: none;
    background: linear-gradient(
      to top,
      var(--paper) 0%,
      var(--paper) 16%,
      color-mix(in oklab, var(--paper) 72%, transparent) 42%,
      color-mix(in oklab, var(--paper) 26%, transparent) 70%,

    );

  .caption {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-shrink: 0;
    min-height: 5.5rem;
    padding: 0 1rem 1.75rem;

  .caption .inner { flex: 1; min-width: 0; }

  /* Step controls sit at the outer edges, the title between them. */
  .step {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 1.125rem;
    cursor: pointer;
    transition: border-color 200ms var(--ease), background 200ms var(--ease);
  }
  .step:hover:not(:disabled) { border-color: color-mix(in oklab, var(--ink) 40%, transparent); background: color-mix(in oklab, var(--ink) 5%, transparent); }
  .step:disabled { cursor: default; border-color: color-mix(in oklab, var(--ink) 5%, transparent); color: color-mix(in oklab, var(--ink-faint) 40%, transparent); }
  .caption h2 { margin: 0; font-size: clamp(1.6rem, 3.4vw, 2.4rem); line-height: 1.1; }
  .caption p { margin: 0.375rem 0 0; color: var(--ink-faint); }
  .caption .inner { transition: opacity 250ms var(--ease); }

  /* ---------- record ---------- */

  .record[hidden] { display: none; }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--paper);
    opacity: 0;
    transition: opacity 280ms var(--ease);
  }
  .record[data-open] .backdrop { opacity: 1; }

  .record-hero {
    position: fixed;
    inset-inline: 0;
    top: 0;
    z-index: 35;
    height: 50vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 52%, transparent 94%);
    mask-image: linear-gradient(to bottom, #000 52%, transparent 94%);
  }
  /*
    The mask above is transparent below roughly 47vh, which is well above the
    skyline. Left on during the return flight it dissolved the monument halfway
    down instead of letting it fly home — so it is dropped while flying.
  */
  .record-hero[data-flying] { -webkit-mask-image: none; mask-image: none; }
  .record-hero > div { color: var(--ink); transform-origin: top left; }
  .record-hero svg { display: block; width: 100%; height: 100%; }

  /*
    Leaving animates on this element alone. Fading this *and* the sheet inside
    it meant two nested opacity layers compositing at once, over a subtree
    holding a photograph and the map — which is what made the exit drag.
    One layer moves; everything within it is static.
  */
  .record-scroll {
    position: fixed;
    inset: 0;
    z-index: 40;
    overflow-y: auto;
    overscroll-behavior: contain;
    opacity: 0;
    translate: 0 44px;
    transition: opacity 340ms var(--ease), translate 420ms var(--ease);
    /* Promoted up front: this layer only exists while a record is open, and
       letting the compositor create it on the exit's first frame is a hitch
       exactly where the movement starts. */
    will-change: opacity, translate;
  }
  .record[data-open] .record-scroll { opacity: 1; translate: 0 0; }

  .back {
    position: fixed;
    left: 1.25rem;
    top: 1.25rem;
    z-index: 50;
    padding: 0.5rem 1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    /* Solid, not blurred: a backdrop-filter inside an animating layer is
       re-read and re-blurred every frame. */
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
  }
  .back:hover { border-color: color-mix(in oklab, var(--ink) 40%, transparent); }
  @media (min-width: 640px) { .back { left: 2rem; top: 2rem; } }

  .record article {

    margin: 42vh auto 0;
    max-width: 48rem;
    padding: 0 1rem 6rem;
  }
  @media (min-width: 640px) { .record article { padding: 0 2rem 6rem; } }

  /* Static: the scroll container above carries the whole record in and out. */
  .sheet {
    border: 1px solid var(--line);
    border-radius: 1rem;
    background: var(--card);
    padding: 1.25rem;
    box-shadow: 0 -24px 60px -40px rgb(20 16 14 / 0.5);

  .sheet .kicker { margin: 0; color: var(--gold); }

  .sheet .tagline { margin: 0.75rem 0 0; font-size: clamp(1.125rem, 2.5vw, 1.5rem); font-style: italic; line-height: 1.3; color: var(--ink-soft); }
  .sheet hr { margin: 1.75rem 0; border: 0; border-top: 1px solid var(--line); }
  .sheet .body { margin: 0; font-size: 0.975rem; line-height: 1.75; color: var(--ink-soft); }

  figure { margin: 2.25rem 0 0; }
  figure .frame { position: relative; overflow: hidden; border-radius: 0.75rem; background: var(--paper-deep); aspect-ratio: 3 / 2; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { margin-top: 0.75rem; font-size: 0.75rem; line-height: 1.6; color: var(--ink-faint); }
  figcaption a { color: inherit; }

  .facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    margin: 2.25rem 0 0;
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    overflow: hidden;
    background: var(--line);
  }
  .facts > div { background: var(--card); padding: 1rem; }
  @media (min-width: 640px) { .facts > div { padding: 1.25rem; } }
  .facts dt { color: var(--ink-faint); }
  .facts dd { margin: 0.375rem 0 0; font-size: 0.9375rem; }

  .encyclopaedia {
    margin: 2.25rem 0 0;
    padding: 1.25rem;
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    background: color-mix(in oklab, var(--paper-deep) 50%, transparent);
  }
  .encyclopaedia h2 { margin: 0; color: var(--ink-faint); }
  .encyclopaedia p { margin: 0.75rem 0 0; font-size: 0.875rem; line-height: 1.75; color: var(--ink-soft); }
  .encyclopaedia a { display: inline-block; margin-top: 1rem; color: var(--ink); }

  /* Ghana drawn, not tiled — no tile server exists inside a CSP'd Artifact. */
  /* Who lives with the monument, set apart from the building's own facts. */
  .life { margin-top: 2.25rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .life > h2 { margin: 0; color: var(--ink-faint); }
  .life .meta { display: grid; gap: 1rem 2rem; margin: 1rem 0 0; }
  @media (min-width: 640px) { .life .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .life .meta .wide { grid-column: 1 / -1; }
  .life dt { color: var(--ink-faint); }
  .life dd { margin: 0.375rem 0 0; font-size: 0.875rem; line-height: 1.6; }

  .festival {
    margin-top: 1.75rem;
    padding: 1.25rem;

    border-radius: 0.75rem;

  .where { margin-top: 2.25rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .where > h2 { margin: 0; color: var(--ink-faint); }
  .where .layout { display: flex; align-items: center; gap: 1.5rem; margin-top: 1rem; }

  .neighbours { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-top: 1.5rem; }
  .neighbours button, .neighbours .empty {
    padding: 1rem;

  .neighbours .next { text-align: right; }
  .neighbours .label { color: var(--ink-faint); }
  .neighbours .name { margin: 0.375rem 0 0; font-size: 1.125rem; line-height: 1.2; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

 across northern Ghana, with drumming, smocks and horsemanship."},"life":"Larabanga is a small farming village on the road to Mole National Park, set in savannah scattered with shea trees. Almost everyone here is Muslim, and the mosque is kept by hereditary custodians who have maintained it across generations. Yam, millet, maize and groundnut are grown through the single rainy season, and women gather and press shea nuts into butter — one of the few reliable sources of cash.","culture":"The building is itself the tradition. After each rainy season the community re-plasters the mud walls, which is the only reason a fifteenth-century structure is still standing: it survives because it is continuously remade, by hand, by the people who pray in it. Beside the village sits the Mystic Stone, which local history holds returned each time road builders tried to move it."}},{"slug":"elmina-castle","name":"Elmina Castle","place":"Elmina","region":"Central Region","year":1482,"yearLabel":"1482","tagline":"The oldest European building south of the Sahara.","description":"Raised by the Portuguese as São Jorge da Mina, Elmina began as a trading post for gold and became a holding station for enslaved people. It passed to the Dutch in 1637 and the British in 1872. The whitewashed walls above and the airless dungeons below tell two versions of the same four centuries.","facts":[{"label":"Built","value":"1482"},{"label":"Founded by","value":"Portugal"},{"label":"Status","value":"UNESCO World Heritage"},{"label":"Region","value":"Central"}],"scale":0.66,"aspect":1.6208,"viewBox":"0 0 1697.000000 1047.000000","art":"<g transform=\"translate(0.000000,1047.000000) scale(0.100000,-0.100000)\" fill=\"currentColor\" stroke=\"none\"> <path d=\"M8454 10156 c-20 -9 -35 -25 -43 -46 -8 -23 -11 -202 -11 -596 0 -388 -3 -564 -11 -564 -23 0 -39 -70 -39 -175 l0 -105 -60 0 -60 0 0 105 c0 127 -13 167 -60 184 -21 7 -116 11 -257 11 -254 0 -283 -6 -302 -60 -8 -24 -11 -339 -11 -1136 l0 -1104 -179 0 c-107 0 sh_Slave_trade_HQ_atamari.jpg"},"community":{"people":"Fante","language":"Fante","livelihood":"Fishing, schooling and tourism","festival":{"name":"Fetu Afahye","when":"First Saturday of September","note":"Asafo companies, palanquins and the Oguaamanhen in procession — begun as a cleansing after a plague."},"life":"Cape Coast — Oguaa — is a town of fishing boats and schoolchildren. It was the seat of colonial administration until 1877 and kept the schools that came with that: Mfantsipim, Adisadel and Wesley Girls' are among the oldest in the country, and the University of Cape Coast sits on the ridge above the town. Term time fills the streets with uniforms.","culture":"Every two years Cape Coast hosts PANAFEST and Emancipation Day, when people of African descent return to the castles — the reason the Door of No Return has been symbolically renamed the Door of Return. For a town carrying that history, it is strikingly unsolemn day to day: the fish market is loud, and the asafo companies still turn out in colour."}},{"slug":"jamestown-lighthouse","name":"Jamestown Lighthouse","place":"Jamestown, Accra","region":"Greater Accra","year":1871,"yearLabel":"1871 · rebuilt 1930","tagline":"Twenty-eight metres above the loudest harbour in Accra.","description":"First lit in 1871 and rebuilt in its current form in 1930, the lighthouse looks out over Jamestown's fishing harbour and the colonial quarter that grew around Fort James. Its beam reaches sixteen nautical miles. Climb it and the whole of old Accra — boxing gyms, canoes, corrugated roofs — lays itself out below.","facts":[{"label":"First lit","value":"1871"},{"label":"Rebuilt","value":"1930"},{"label":"Height","value":"28 metres"},{"label":"Range","value":"16 nautical miles"}],"scale":0.88,"aspect":1.371,"viewBox":"0 0 680.000000 496.000000","art":"<g transform=\"translate(0.000000,496.000000) scale(0.100000,-0.100000)\" fill=\"currentColor\" stroke=\"none\"> <path d=\"M4721 4620 c-63 -19 -120 -65 -121 -99 0 -14 -98 -11 rance_with_Kwame_Nkrumah_Memorial_Park.jpg"},"community":{"people":"Ga","language":"Ga","livelihood":"Civic, museums and tourism","festival":{"name":"Founders' Day","when":"21 September","note":"Nkrumah's birthday, marked nationally and observed at the park."},"life":"The mausoleum stands in a park in central Accra on the Old Polo Grounds — the ground where Nkrumah declared independence at midnight in 1957. It is now one of the calmest places in the middle of the city: fountains, lawns and a museum, a few minutes' walk from the noise of Makola market.","culture":"The park has become a place of pilgrimage for pan-Africanists and for the diaspora, particularly since the Year of Return in 2019 drew large numbers of visitors of African descent to Ghana. Nkrumah's reputation at home is more argued over than abroad — he was overthrown in 1966 — and the park is where that argument is most visible."}},{"slug":"national-theatre-ghana","name":"National Theatre","place":"Accra","region":"Greater Accra","year":1992,"yearLabel":"1992","tagline":"A ship under full sail, moored in the middle of Accra.","description":"Designed by Chinese architect Cheng Taining and gifted to Ghana in 1992, the National Theatre is an expressionist white sweep of curved roofs that reads as sails, or a bird mid-take-off, depending on where you stand. It seats 1,500 and is home to the National Dance Company, National Symphony Orchestra and National Theatre Players.","facts":[{"label":"Opened","value":"1992"},{"label":"Architect","value":"Cheng Taining"},{"label":"Seats","value":"1,500"},{"label":"Home to","value":"Three national companies"}],"scale":0.68,"aspect":1.9132,"viewBox":"0 0 1697.000000 887.000000","art":"<g transform=\"translate(0.000000,887.000000) scale(0.100000,-0.100000)\" fill=\"currentColor\" stroke=\"none\"> <path d=\"M10705 8558 c-438 -56 -818 -120 -1148 -194 -2508 -559 -4453 -1959 -5560 -4004 -450 -830 -745 -1754 -876 -2738 -23 -167 -18 -196 35 -218 28 -12 928 -14 6032 -14 4450 0 60                 '<path class="pin" d="' + PIN + '" vector-effect="non-scaling-stroke" />' +
                '<circle class="pin-hole" cy="-40" r="8" />' +
                '<circle class="hit" r="40" role="button" tabindex="0" data-zoom aria-pressed="false" aria-label="Zoom to the exact position" />' +
                '<circle class="halo gold" cy="-26" r="34" vector-effect="non-scaling-stroke" />' +
              "</g></g>" +
          "</svg>" +
          '<figcaption class="eyebrow"><button type="button" data-zoom>Zoom to pin</button></figcaption>' +
          "</figure>" +
          "<dl>" +
            '<dt class="eyebrow">Place</dt><dd class="place serif">' + esc(m.place) + "</dd>" +
            '<dt class="eyebrow">Region</dt><dd class="region">' + esc(m.region) + "</dd>" +
            '<dt class="eyebrow">Coordinates</dt><dd class="coords">' +
              Math.abs(m.coordinates.lat).toFixed(4) + "°" + (m.coordinates.lat >= 0 ? "N" : "S") + "<br />" +
              Math.abs(m.coordinates.lon).toFixed(4) + "°" + (m.coordinates.lon >= 0 ? "E" : "W") +
            "</dd>" +
            '<dd class="note">The faint marks are the other ten — select one to open it.</dd>' +
          "</dl>" +
        "</div></section>"
      : "";

    const index = MONUMENTS.findIndex((x) => x.slug === m.slug);
    const neighbour = (other, isNext) => other
      ? '<button type="button" class="' + (isNext ? "next" : "") + '" data-goto="' + other.slug + '">' +
        '<span class="eyebrow label">' + (isNext ? "Later →" : "← Earlier") + "</span>" +
        '<p class="name serif">' + esc(other.name) + "</p>" +
        '<span class="eyebrow label">' + esc(other.yearLabel) + "</span></button>"
      : '<div class="empty ' + (isNext ? "next" : "") + '"><span class="eyebrow">' +
        (isNext ? "End of the line" : "Start of the line") + "</span></div>";

    recordBody.innerHTML =
      '<div class="sheet">' +
        '<p class="kicker eyebrow">' + esc(m.yearLabel) + " · " + esc(m.region) + "</p>" +
        '<h1 class="serif">' + esc(m.name) + "</h1>" +
        '<p class="tagline serif">' + esc(m.tagline) + "</p>" +
        "<hr />" +
        '<p class="body">' + esc(m.description) + "</p>" +
        photo +
        '<dl class="facts">' + facts + "</dl>" +
        encyclopaedia +
        life +
        where +
      "</div>" +
      '<nav class="neighbours">' +
        neighbour(MONUMENTS[index - 1], false) +
        neighbour(MONUMENTS[index + 1], true) +
      "</nav>";

    for (const button of recordBody.querySelectorAll("[data-goto]")) {
      button.addEventListener("click", () => openRecord(button.dataset.goto));
    }
    wireMap(m);
  }

  /**
   * The map's zoom moves the viewBox rather than transforming a group: CSS
   * transforms on an SVG <g> are unreliable across engines, and the SVG
   * transform attribute cannot be transitioned. Frames are written straight to
   * the DOM so the outline and eleven marks are not rebuilt sixty times a second.
   */
  function wireMap(m) {
    const svg = recordBody.querySelector("#ghanaMap");
    if (!svg || !m.mapPoint) return;

    let box = MAP_FULL.slice();
    let zoomed = false;
    let frame = 0;

    const paint = (next) => {
      box = next;
      svg.setAttribute("viewBox", next.join(" "));
      // Counter-scale the marks so zooming reveals position, not bigger blobs.
      const inverse = next[2] / MAP_FULL[2];
      for (const mark of svg.querySelectorAll("[data-mark]")) {
        mark.setAttribute("transform", "scale(" + inverse + ")");
      }
    };

    const setZoom = (next) => {
      zoomed = next;
      const target = zoomed
        ? [
            m.mapPoint.x - MAP_FULL[2] / (2 * MAP_ZOOM),
            m.mapPoint.y - MAP_FULL[3] / (2 * MAP_ZOOM),
            MAP_FULL[2] / MAP_ZOOM,
            MAP_FULL[3] / MAP_ZOOM,
          ]
        : MAP_FULL.slice();

      for (const control of recordBody.querySelectorAll("[data-zoom]")) {
        if (control.tagName === "BUTTON") {
          control.textContent = zoomed ? "Whole country" : "Zoom to pin";
        } else {
          control.setAttribute("aria-pressed", String(zoomed));
          control.setAttribute(
            "aria-label",
            zoomed ? "Zoom back out to the whole country" : "Zoom to the exact position"
          );
        }
      }

      // A hidden tab gets no animation frames, so a tween there would never
      // arrive and would strand the map between states. Same for reduced motion.
      if (reduced || document.hidden) { paint(target); return; }

      const from = box.slice();
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / 650);
        const eased = 1 - Math.pow(1 - t, 4);
        paint(from.map((value, i) => value + (target[i] - value) * eased));
        if (t < 1) frame = requestAnimationFrame(tick);
      };
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(tick);
    };

    paint(MAP_FULL.slice());

    for (const control of recordBody.querySelectorAll("[data-zoom]")) {
      control.addEventListener("click", () => setZoom(!zoomed));
      control.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        setZoom(!zoomed);
      });
    }

    for (const hit of svg.querySelectorAll("[data-open]")) {
      hit.addEventListener("click", () => openRecord(hit.dataset.open));
      hit.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        openRecord(hit.dataset.open);
      });
    }
  }

  /**
   * The flight is an explicit FLIP: measure the skyline slot and the record
   * hero, then animate between them. No shared-element machinery is involved,
   * so the transform-driven track underneath cannot skew it.
   */
  function flight(hero, slot, back) {
    hero.style.transform = "none";
    const here = hero.getBoundingClientRect();
    const there = slot.getBoundingClientRect();
    if (!here.width || !there.width) return null;

    const from = "translate(" + (there.left - here.left) + "px, " + (there.top - here.top) +
      "px) scale(" + there.width / here.width + ")";

    // Drop the container mask for the return flight, or the monument dissolves
    // partway down instead of arriving at the skyline.
    if (back) recordHero.setAttribute("data-flying", "");
    else recordHero.removeAttribute("data-flying");

    if (reduced) { hero.style.transform = back ? from : "none"; return null; }

    // Seat the first frame synchronously — otherwise one paint lands untransformed.
    hero.style.transform = back ? "none" : from;
    return hero.animate(
      [{ transform: back ? "none" : from }, { transform: back ? from : "none" }],
      { duration: FLIGHT, easing: EASE, fill: "both" }
    );
  }

  function openRecord(slug) {
    const m = MONUMENTS.find((x) => x.slug === slug);
    if (!m) return;

    const previous = openSlug;
    openSlug = slug;
    session += 1;
    renderRecord(m);

    // Centre the monument behind the record so the return flight lands true.
    const o = offsetFor(slug);
    if (o !== null) { userMoved = true; jumpTo(o); }

    if (previous && nodes.get(previous)) nodes.get(previous).querySelector(".slot").style.visibility = "";
    const slot = nodes.get(slug).querySelector(".slot");
    slot.style.visibility = "hidden";

    const heroInner = recordHero.firstElementChild;
    heroInner.style.aspectRatio = m.aspect;
    heroInner.style.height = "min(42vh, calc(84vw / " + m.aspect + "))";
    heroInner.innerHTML = '<svg viewBox="' + m.viewBox + '" preserveAspectRatio="xMidYMax meet" aria-hidden="true">' + m.art + "</svg>";

    record.hidden = false;
    recordScroll.scrollTop = 0;
    document.body.style.overflow = "hidden";

    // Force layout so the opening transition actually runs from its start state.
    void record.offsetWidth;
    record.setAttribute("data-open", "");
    flight(heroInner, slot, false);
    document.getElementById("back").focus({ preventScroll: true });
  }

  function closeRecord() {
    if (!openSlug) return;
    const slot = nodes.get(openSlug).querySelector(".slot");
    const heroInner = recordHero.firstElementChild;
    const slug = openSlug;
    openSlug = null;
    session += 1;
    const mine = session;

    record.removeAttribute("data-open");
    const animation = flight(heroInner, slot, true);

    const finish = () => {
      if (session !== mine) return; // a new record opened while we were leaving
      record.hidden = true;
      document.body.style.overflow = "";
      slot.style.visibility = "";
      heroInner.style.transform = "none";
      heroInner.innerHTML = "";
      const button = nodes.get(slug) && nodes.get(slug).querySelector("button");
      if (button) button.focus({ preventScroll: true });
    };

    if (animation) animation.finished.then(finish).catch(finish);
    else finish();
  }

  document.getElementById("back").addEventListener("click", closeRecord);
  addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !record.hidden) closeRecord();
  });

  /* ---------- boot ---------- */

  function layout() {
    measure();
    if (!userMoved) jumpTo(offsetFor(MONUMENTS[0].slug) ?? min);
    else { target = clamp(target); offset = clamp(offset); paint(); }
  }

  layout();
  new ResizeObserver(layout).observe(viewport);
  new ResizeObserver(layout).observe(track);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
